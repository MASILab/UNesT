    'depth': [2, 2, 8],     # Transformer各层深度
    'embed_dims': [128, 256, 512],  # 各层嵌入维度
    'num_heads': [4, 8, 16],        # 各层注意力头数
    
    # ==================== 训练配置 ====================
    'num_steps': 50000,     # 总训练步数
    'lr': 0.00001,          # 学习率
    'decay': 0.00001,       # 权重衰减
    'momentum': 0.9,        # SGD动量（仅SGD优化器使用）
    'batch_size': 1,        # 批次大小（3D医学图像通常为1）
    'warmup_steps': 0,      # 学习率warmup步数
    
    # ==================== 损失函数配置 ====================
    'loss_type': 'dice_ce', # 损失类型: 'dice', 'ce', 'dice_ce', 'wce', 'dice_wce'
