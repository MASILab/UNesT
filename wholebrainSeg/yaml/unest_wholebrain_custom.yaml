# UNesT 全脑分割训练配置文件
# 用于自定义数据集训练

{
    # ==================== 目录配置 ====================
    'logdir': '/home/tenoke4090/B_WorkPath/mrqs/UNesT/wholebrainSeg/logs/wholebrain_custom',
    'data_dir': '/home/tenoke4090/B_WorkPath/mrqs/wholebrainseg_dataset',
    'jsondir': '/home/tenoke4090/B_WorkPath/mrqs/wholebrainseg_dataset/json',
    'use_pretrained': '',  # 预训练权重路径，留空表示从头训练
    
    # ==================== 交叉验证配置 ====================
