    # ==================== 优化器配置 ====================
    'opt': 'adamw',         # 优化器: 'adam', 'adamw', 'sgd'
    'lrdecay': True,        # 是否使用学习率衰减
    
    # ==================== 网络结构配置 ====================
    'conv_block': True,
    'res_block': True,
    'amp': False,           # 自动混合精度训练
    
    # ==================== ROI配置 ====================
    'roi_x': 96,            # 训练ROI大小
    'roi_y': 96,
    'roi_z': 96,
    'sw_batch_size': 1,     # 滑动窗口推理批次大小
    
    # ==================== 验证配置 ====================
    'eval_num': 400,        # 每隔多少步验证一次
    
    # ==================== 数据增强配置 ====================
    'aug_type': {
        'flip': 0.01,           # 翻转概率
        'rotate': 0.00,         # 旋转概率（可设为0.2启用）
        'scale_intensity': 0.01, # 强度缩放概率
        'shif_intensity': 0.01   # 强度偏移概率
    }
}
